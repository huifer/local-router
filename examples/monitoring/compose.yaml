# A monitoring stack for one local-router instance.
#
# Bring it up next to (or instead of) the gateway:
#   docker compose -f examples/monitoring/compose.yaml up -d
#
# It runs a Prometheus scraping the gateway's /metrics and a Grafana that
# reads it. Point Grafana at the "local-router" data source and open the
# dashboard; the panel shows the live rate limits, cooldowns, in-flight
# requests, per-provider token throughput, and latency — the same numbers
# the console shows, but as a live view with history.
#
# The gateway in this stack is the stock container; point it at the
# dashboard's own metrics endpoint or swap in your running instance by
# editing `prometheus.yml`'s target.
services:
  local-router:
    image: ghcr.io/huifer/local-router:latest
    container_name: lr-monitor-gateway
    restart: unless-stopped
    ports:
      - "3436:3435"
    environment:
      LOCAL_ROUTER_HOME: /data
      LOCAL_ROUTER_GATEWAY_ADDR: 0.0.0.0
      LOCAL_ROUTER_GATEWAY_PORT: "3435"
      LOCAL_ROUTER_DEFAULT_KEY: ${LOCAL_ROUTER_DEFAULT_KEY:-local-router}
    volumes:
      - lr-monitor-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3435/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s

  prometheus:
    image: prom/prometheus:latest
    container_name: lr-monitor-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: lr-monitor-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-router}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - lr-monitor-grafana:/var/lib/grafana

volumes:
  lr-monitor-data:
  lr-monitor-grafana:

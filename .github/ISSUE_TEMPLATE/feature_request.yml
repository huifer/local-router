name: ✨ 功能建议
description: 提议一个新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 先说场景和痛点，而不是实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
  - type: markdown
    attributes:
      value: |
        提议前请读 README 的「范围与取舍」：桌面客户端、TUI、订阅账号
        登录态、插件生态是明确不做的方向。

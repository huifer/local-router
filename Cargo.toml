[package]
name = "local-router"
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
description = "A local AI gateway that gives every coding agent every model — web mode"
repository = "https://github.com/huifer/local-router"
homepage = "https://github.com/huifer/local-router"
documentation = "https://github.com/huifer/local-router#readme"
license = "MIT"
readme = "README.md"

# 发布包需要 frontend/dist（被 .gitignore 排除、但二进制用 include_str! 内嵌），
# 而 [package].include 一旦出现就会取代 git 枚举，所以这里完整列出文件集。
include = [
    "build.rs",
    "Cargo.toml",
    "Cargo.lock",
    "src/**",
    "tests/**",
    "examples/**",
    "docs/**",
    "scripts/**",
    ".github/**",
    "frontend/dist",
    "frontend/index.html",
    "frontend/package.json",
    "frontend/package-lock.json",
    "frontend/tsconfig.json",
    "frontend/vite.config.ts",
    "frontend/src/**",
    "README.md",
    "CHANGELOG.md",
    "USAGE.md",
    "LICENSE",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "og-image.jpg",
    "Dockerfile",
    "compose.yaml",
    ".dockerignore",
    ".gitignore",
]
exclude = [
    "frontend/node_modules",
    "frontend/tsconfig.tsbuildinfo",
]

keywords = ["llm", "gateway", "proxy", "openai", "anthropic"]
categories = ["command-line-utilities", "network-programming", "web-programming::http-server"]
default-run = "local-router"

[[bin]]
name = "local-router"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
bytes = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "http2",
    "multipart",
] }
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-stream = "0.3"
dirs = "5"
base64 = "0.22"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rsa = { version = "0.9", default-features = false, features = ["std"] }
pkcs1 = { version = "0.7", features = ["pem"] }
md-5 = "0.10"
hex = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

[features]
# OTLP tracing export is opt-in and hand-rolled (see src/telemetry.rs): no
# OpenTelemetry SDK is ever linked into the binary. Without the feature the
# module compiles to no-ops and behavior/size are unchanged.
default = []
otlp = []

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dependencies.rusqlite]
version = "0.32"
features = ["bundled"]

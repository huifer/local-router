services:
  local-router:
    build: .
    image: local-router:latest
    container_name: local-router
    restart: unless-stopped
    ports:
      # 按需改成宿主机端口；容器内固定 3435（网关与控制台共用一个端口）
      - "3435:3435"
    environment:
      LOCAL_ROUTER_HOME: /data
      LOCAL_ROUTER_GATEWAY_ADDR: 0.0.0.0
      LOCAL_ROUTER_GATEWAY_PORT: "3435"
      # 默认调用密钥（建议改成自己的）
      LOCAL_ROUTER_DEFAULT_KEY: ${LOCAL_ROUTER_DEFAULT_KEY:-local-router}
      LOCAL_ROUTER_LOG: ${LOCAL_ROUTER_LOG:-info}
    volumes:
      - local-router-data:/data
      # 想在容器里用本机 WorkBuddy 登录态（需宿主是 macOS）：
      # - /Users/<你>/Library/Application Support/CodeBuddyExtension/Data/Public/auth/workbuddy-desktop.info:/workbuddy/auth/workbuddy-desktop.info:ro
      # 并设 LOCAL_ROUTER_WORKBUDDY_SESSION=/workbuddy/auth/workbuddy-desktop.info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3435/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s

volumes:
  local-router-data:
